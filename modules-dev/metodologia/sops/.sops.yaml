# SOPS configuration file
# This file defines encryption rules for sensitive files in git repositories
# This file contains the public AGE key and is safe to commit to git
creation_rules:
    # Rule for YAML files - encrypt only keys ending with _enc
    - path_regex: \.(yaml|yml)$
      indent: 2
      encrypted_regex: ^.*_enc$
      age: age1wt0nlv2q4mk3s25y2rg3kkdzpd7ajxvrznvtepqk6kztfpetyawqsvgu72
    # Rule for properties files - encrypt only keys ending with _enc
    # Note: SOPS treats .properties as dotenv format for selective encryption
    - path_regex: \.properties$
      encrypted_regex: ^.*_enc$
      age: age1wt0nlv2q4mk3s25y2rg3kkdzpd7ajxvrznvtepqk6kztfpetyawqsvgu72
# To get your age public key, run:
# age-keygen -y ~/.config/sops/age/keys.txt
